[package]
name = "swmm-core"
edition = "2024"
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
anyhow_ext = { workspace = true }
dashmap = { workspace = true, features = ["rayon"] }
dirs2 = { workspace = true }
fs-err = { workspace = true }
glob = { workspace = true }
join_str = { workspace = true }
jwalk = { workspace = true }
lenient_semver = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true, features = ["serde"] }
path-slash = { workspace = true }
rayon = { workspace = true }
roead = { workspace = true, features = ["yaml"] }
rstb = { workspace = true }
rustc-hash = { workspace = true }
sanitise-file-name = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde_with = { workspace = true }
sevenz-rust = { workspace = true }
smartstring = { workspace = true, features = ["serde"] }
unrar = { workspace = true }
zip = { workspace = true, default-features = false, features = ["deflate"] }

tempfile = "3.3"
uk-content = { workspace = true }
swmm-i18n = { path = "../i18n" }
