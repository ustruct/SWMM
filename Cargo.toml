[workspace]
resolver = "2"
members = [
    "app",
    "crates/common",
    "crates/core",
    "crates/formats",
    "crates/formats-derive",
    "crates/gamefiles",
    "crates/i18n",
    "crates/loader",
    "crates/modpack",
    "crates/widgets",
]

[workspace.package]
version = "0.1.0"
license = "GPL-3.0-or-later"
authors = ["SWMM contributors"]

[workspace.dependencies]
anyhow = "1"
anyhow_ext = "0.2.1"
dashmap = "6"
dirs2 = "3"
eframe = { version = "0.28", default-features = false }
flume = "0.11.0"
fs-err = "2.9"
glob = "0.3.2"
include-flate = "0.3.0"
indexmap = { version = "2.2.6", features = ["serde"] }
join_str = "0.1.0"
jwalk = "0.8.1"
lenient_semver = { version = "0.4.2", features = ["version_serde"] }
log = "0.4.17"
minicbor-ser = "0.2.0"
parking_lot = "0.12.1"
path-slash = "0.2.1"
rayon = "1.6"
rfd = "0.14.1"
roead = { git = "https://github.com/GingerAvalanche/roead.git" }
rstb = { git = "https://github.com/GingerAvalanche/rstb-rust.git", branch = "chemical", features = ["complex", "botw-data"] }
rustc-hash = "2"
sanitise-file-name = "1"
serde = "1"
serde_json = "1"
serde_yaml = "0.9.13"
serde_with = "3"
sevenz-rust = "0.6.0"
smartstring = "1"
strfmt = "0.2.4"
thiserror = "1"
typetag = "0.2.1"
unrar = "0.5.8"
zip = { version = "2.1", default-features = false }
zstd = { version = "0.13.1", features = ["experimental"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
